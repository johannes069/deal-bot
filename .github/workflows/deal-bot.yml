name: Deal-Bot

on:
  schedule:
    # Alle 30 Minuten (Minute 7 und 37, damit wir nicht im Stoßzeit-Stau zur vollen Stunde landen)
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      modus:
        description: "normal = Deals suchen | test = Testnachricht | trockenlauf = nur anzeigen, nichts senden"
        type: choice
        default: normal
        options:
          - normal
          - test
          - trockenlauf

permissions:
  contents: write

concurrency:
  group: deal-bot
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Bot starten
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --modus "${{ github.event.inputs.modus || 'normal' }}"

      - name: Gemeldete Deals speichern (seen.json)
        if: always()
        run: |
          git config user.name "deal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "seen.json unverändert."
            exit 0
          fi
          git commit -m "seen.json aktualisieren"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          echo "seen.json konnte nicht gespeichert werden - nächster Lauf versucht es erneut."
